<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1221" />
      <stop offset="52%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <radialGradient id="glowSky" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 105) rotate(135) scale(270)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 420) rotate(-35) scale(230)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="roofGrad" x1="156" y1="108" x2="356" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="55%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="barGrad" x1="172" y1="386" x2="340" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="textShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Modern Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glowSky)" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glowEmerald)" />
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" />

  <!-- Minimalist Architectural Roof + Community Node -->
  <path
    d="M164 196 L256 122 L348 196"
    stroke="url(#roofGrad)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="256" cy="180" r="13" fill="#34D399" />
  <circle cx="222" cy="192" r="7.5" fill="#7DD3FC" fill-opacity="0.88" />
  <circle cx="290" cy="192" r="7.5" fill="#7DD3FC" fill-opacity="0.88" />

  <!-- Bold Aesthetic SIWA Wordmark -->
  <text
    x="256"
    y="334"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="122"
    font-weight="900"
    letter-spacing="6"
    filter="url(#textShadow)"
  >SIWA</text>

  <!-- Sleek Accent Bar -->
  <rect x="172" y="376" width="168" height="12" rx="6" fill="url(#barGrad)" />
</svg>
